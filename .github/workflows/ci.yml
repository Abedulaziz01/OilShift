name: OilShift CI

on:
  push:
    branches:
      - main
      - task-*

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Compile project
        run: |
          python -m compileall app.py oilshift scripts
